<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PlushIntel</title>
    <style>
        body { font-family: Arial; background: #fef6f0; color: #333; display: flex; flex-direction: column; align-items: center; }
        #chat-box { width: 500px; max-width: 90%; height: 400px; border: 2px solid #f5a623; border-radius: 10px; padding: 10px; overflow-y: scroll; background: #fff0f5; margin-top: 20px; }
        #input-box { width: 500px; max-width: 90%; margin-top: 10px; display: flex; }
        #message { flex-grow: 1; padding: 10px; border-radius: 5px; border: 1px solid #f5a623; }
        #send { padding: 10px 15px; margin-left: 5px; border-radius: 5px; background: #f5a623; border: none; cursor: pointer; }
        .user { color: #2a2a72; font-weight: bold; }
        .bot { color: #d6336c; font-weight: bold; }
        .message { margin: 5px 0; }
    </style>
</head>
<body>
    <h1>PlushIntel 🐾</h1>
    <div id="chat-box"></div>
    <div id="input-box">
        <input type="text" id="message" placeholder="Ask PlushIntel anything..." />
        <button id="send">Send</button>
    </div>

    <script>
        const chatBox = document.getElementById("chat-box");
        const messageInput = document.getElementById("message");
        const sendButton = document.getElementById("send");

        function addMessage(sender, text) {
            const msgDiv = document.createElement("div");
            msgDiv.className = "message";
            msgDiv.innerHTML = `<span class="${sender}">${sender}:</span> ${text}`;
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        async function sendMessage() {
            const message = messageInput.value.trim();
            if (!message) return;
            addMessage("Labubu", message);
            messageInput.value = "";
            
            const response = await fetch("/chat", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ message })
            });
            const data = await response.json();
            addMessage("PlushIntel", data.reply);
        }

        sendButton.addEventListener("click", sendMessage);
        messageInput.addEventListener("keypress", (e) => {
            if (e.key === "Enter") sendMessage();
        });
    </script>
</body>
</html>
